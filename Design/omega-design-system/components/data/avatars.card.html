<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px}.cols{display:flex;gap:20px;align-items:flex-start}.col{flex:1;min-width:0}.lbl{font:var(--text-caption);color:var(--ink-3);margin:0 0 8px}.lbl:not(:first-child){margin-top:20px}.stack{display:flex;flex-direction:column;gap:12px}.wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.x-tertiary{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:12px;border-radius:var(--radius-md);font:var(--text-body-strong);color:var(--accent-text);--icon-size:18px} .r{display:flex;gap:28px;align-items:flex-end}.c{display:flex;flex-direction:column;align-items:center;gap:8px}.c .lbl{margin:0}</style>
</head><body>
<div class="r">
  <div class="c"><span class="om-avatar" aria-label="Aarav Kumar">AK</span><p class="lbl">Default, 40</p></div>
  <div class="c"><span class="om-avatar" style="--avatar-size:48px" aria-label="Meera Nair">MN</span><p class="lbl">Size 48</p></div>
  <div class="c"><span class="om-avatar" style="--avatar-size:56px" aria-label="Rohan Iyer">RI</span><p class="lbl">Size 56</p></div>
  <div class="c"><span class="om-avatar om-avatar--tappable" role="button" aria-label="Switch profile">S</span><p class="lbl">Tappable</p></div>
  <div class="c"><span class="om-avatar om-avatar--tappable is-pressed" role="button" aria-label="Switch profile">AK</span><p class="lbl">Pressed</p></div>
</div>
</body></html>
