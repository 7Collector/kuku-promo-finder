<!-- @dsCard group="Forms" viewport="700x604" name="Time picker dialog" subtitle="24-hour clock: hour being edited, sunken face, accent hand, Cancel and Done" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px}.lab{font:var(--text-caption);color:var(--ink-2);margin:0 0 8px}.lab:not(:first-child){margin-top:20px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;align-items:start}.surf{background:var(--surface);border-radius:var(--radius-lg);padding:16px}.board{background:var(--board);border-radius:var(--radius-xl);padding:20px}.om-picker-scrim{border-radius:var(--radius-lg)}</style>
</head><body>
<div class="om-picker-scrim">
  <div class="om-picker-dialog" role="dialog" aria-label="Reminder time">
    <h2 class="om-picker-dialog__title">Reminder time</h2>
    <div class="om-time-picker">
      <div class="om-time-picker__display"><span class="om-time-picker__unit is-selected">18</span><span class="om-time-picker__separator">:</span><span class="om-time-picker__unit">00</span></div>
      <div class="om-time-picker__dial"><span class="om-time-picker__hand om-time-picker__hand--inner" style="--om-dial-angle:180deg"></span><span class="om-time-picker__number " style="--om-dial-angle:0deg">12</span><span class="om-time-picker__number " style="--om-dial-angle:30deg">1</span><span class="om-time-picker__number " style="--om-dial-angle:60deg">2</span><span class="om-time-picker__number " style="--om-dial-angle:90deg">3</span><span class="om-time-picker__number " style="--om-dial-angle:120deg">4</span><span class="om-time-picker__number " style="--om-dial-angle:150deg">5</span><span class="om-time-picker__number " style="--om-dial-angle:180deg">6</span><span class="om-time-picker__number " style="--om-dial-angle:210deg">7</span><span class="om-time-picker__number " style="--om-dial-angle:240deg">8</span><span class="om-time-picker__number " style="--om-dial-angle:270deg">9</span><span class="om-time-picker__number " style="--om-dial-angle:300deg">10</span><span class="om-time-picker__number " style="--om-dial-angle:330deg">11</span><span class="om-time-picker__number om-time-picker__number--inner" style="--om-dial-angle:0deg">00</span><span class="om-time-picker__number om-time-picker__number--inner" style="--om-dial-angle:30deg">13</span><span class="om-time-picker__number om-time-picker__number--inner" style="--om-dial-angle:60deg">14</span><span class="om-time-picker__number om-time-picker__number--inner" style="--om-dial-angle:90deg">15</span><span class="om-time-picker__number om-time-picker__number--inner" style="--om-dial-angle:120deg">16</span><span class="om-time-picker__number om-time-picker__number--inner" style="--om-dial-angle:150deg">17</span><span class="om-time-picker__number om-time-picker__number--inner is-selected" style="--om-dial-angle:180deg">18</span><span class="om-time-picker__number om-time-picker__number--inner" style="--om-dial-angle:210deg">19</span><span class="om-time-picker__number om-time-picker__number--inner" style="--om-dial-angle:240deg">20</span><span class="om-time-picker__number om-time-picker__number--inner" style="--om-dial-angle:270deg">21</span><span class="om-time-picker__number om-time-picker__number--inner" style="--om-dial-angle:300deg">22</span><span class="om-time-picker__number om-time-picker__number--inner" style="--om-dial-angle:330deg">23</span></div>
    </div>
    <div class="om-picker-dialog__actions">
      <button class="om-button om-button--secondary om-button--compact"><span class="om-button__label">Cancel</span></button>
      <button class="om-button om-button--primary om-button--compact"><span class="om-button__label">Done</span></button>
    </div>
  </div>
</div>
</body></html>
