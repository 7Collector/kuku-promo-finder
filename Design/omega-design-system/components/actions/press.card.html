<!-- @dsCard group="Actions" viewport="700x142" name="Press feedback" subtitle="Ink ripple layer on rows and buttons; tiles and cards also scale to 98%" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px}.lab{font:var(--text-caption);color:var(--ink-2);margin:0 0 8px}.lab:not(:first-child){margin-top:20px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;align-items:start}.surf{background:var(--surface);border-radius:var(--radius-lg);padding:16px}.board{background:var(--board);border-radius:var(--radius-xl);padding:20px}.tile{flex:1;background:var(--surface);border-radius:var(--radius-md);padding:16px;display:flex;flex-direction:column;gap:4px;text-align:left}.tile p{font:var(--text-subhead);color:var(--ink-2)}.row{flex-wrap:nowrap;gap:12px}</style>
</head><body>
<p class="lab">A tile that is one tap target: resting, pressed (ripple and 98% scale), and a row pressed (ripple only)</p>
<div class="row">
  <button class="tile om-pressable om-pressable--scale"><span class="om-body-strong">Attendance</span><p>32 of 34 present</p></button>
  <button class="tile om-pressable om-pressable--scale is-pressed"><span class="om-body-strong">Homework</span><p>3 due this week</p></button>
  <button class="tile om-pressable is-pressed"><span class="om-body-strong">Class 8 B</span><p>List row, no scale</p></button>
</div>
</body></html>
