<!-- @dsCard group="Forms" viewport="700x661" name="Date picker dialog" subtitle="Selected day in accent, today ringed, Cancel and Done" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px}.lab{font:var(--text-caption);color:var(--ink-2);margin:0 0 8px}.lab:not(:first-child){margin-top:20px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;align-items:start}.surf{background:var(--surface);border-radius:var(--radius-lg);padding:16px}.board{background:var(--board);border-radius:var(--radius-xl);padding:20px}.om-picker-scrim{border-radius:var(--radius-lg)}</style>
</head><body>
<div class="om-picker-scrim">
  <div class="om-picker-dialog om-picker-dialog--date" role="dialog" aria-label="Due date">
    <h2 class="om-picker-dialog__title">Due date</h2>
    <div class="om-date-picker">
      <p class="om-date-picker__headline">Oct 22, 2026</p>
      <div class="om-date-picker__rule"></div>
      <div class="om-date-picker__nav"><span class="om-date-picker__month">October 2026<i class="om-icon om-icon-chevron-right"></i></span>
        <button class="om-date-picker__arrow" aria-label="Previous month"><i class="om-icon om-icon-chevron-left"></i></button>
        <button class="om-date-picker__arrow" aria-label="Next month"><i class="om-icon om-icon-chevron-right"></i></button></div>
      <div class="om-date-picker__week"><span class="om-date-picker__weekday">S</span><span class="om-date-picker__weekday">M</span><span class="om-date-picker__weekday">T</span><span class="om-date-picker__weekday">W</span><span class="om-date-picker__weekday">T</span><span class="om-date-picker__weekday">F</span><span class="om-date-picker__weekday">S</span></div>
      <div class="om-date-picker__week"><span class="om-date-picker__day "><span></span></span><span class="om-date-picker__day "><span></span></span><span class="om-date-picker__day "><span></span></span><span class="om-date-picker__day "><span></span></span><span class="om-date-picker__day "><span>1</span></span><span class="om-date-picker__day "><span>2</span></span><span class="om-date-picker__day "><span>3</span></span></div><div class="om-date-picker__week"><span class="om-date-picker__day "><span>4</span></span><span class="om-date-picker__day "><span>5</span></span><span class="om-date-picker__day "><span>6</span></span><span class="om-date-picker__day "><span>7</span></span><span class="om-date-picker__day "><span>8</span></span><span class="om-date-picker__day "><span>9</span></span><span class="om-date-picker__day "><span>10</span></span></div><div class="om-date-picker__week"><span class="om-date-picker__day "><span>11</span></span><span class="om-date-picker__day "><span>12</span></span><span class="om-date-picker__day is-today"><span>13</span></span><span class="om-date-picker__day "><span>14</span></span><span class="om-date-picker__day "><span>15</span></span><span class="om-date-picker__day "><span>16</span></span><span class="om-date-picker__day "><span>17</span></span></div><div class="om-date-picker__week"><span class="om-date-picker__day "><span>18</span></span><span class="om-date-picker__day "><span>19</span></span><span class="om-date-picker__day "><span>20</span></span><span class="om-date-picker__day "><span>21</span></span><span class="om-date-picker__day is-selected"><span>22</span></span><span class="om-date-picker__day "><span>23</span></span><span class="om-date-picker__day "><span>24</span></span></div><div class="om-date-picker__week"><span class="om-date-picker__day "><span>25</span></span><span class="om-date-picker__day "><span>26</span></span><span class="om-date-picker__day "><span>27</span></span><span class="om-date-picker__day "><span>28</span></span><span class="om-date-picker__day "><span>29</span></span><span class="om-date-picker__day "><span>30</span></span><span class="om-date-picker__day "><span>31</span></span></div><div class="om-date-picker__week"><span class="om-date-picker__day "><span></span></span><span class="om-date-picker__day "><span></span></span><span class="om-date-picker__day "><span></span></span><span class="om-date-picker__day "><span></span></span><span class="om-date-picker__day "><span></span></span><span class="om-date-picker__day "><span></span></span><span class="om-date-picker__day "><span></span></span></div>
    </div>
    <div class="om-picker-dialog__actions">
      <button class="om-button om-button--secondary om-button--compact"><span class="om-button__label">Cancel</span></button>
      <button class="om-button om-button--primary om-button--compact"><span class="om-button__label">Done</span></button>
    </div>
  </div>
</div>
</body></html>
