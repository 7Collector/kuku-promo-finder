<!-- @dsCard group="Colors" viewport="700x330" name="Semantic tones" subtitle="Strong, container and on-container; never decorative, always paired with text or an icon" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px}.n{font:var(--text-caption);color:var(--ink-2);margin:8px 0 1px}.v{font:var(--text-caption);color:var(--ink-3);font-feature-settings:"tnum"}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.t{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-lg);font:var(--text-subhead)}.t b{font-weight:500;flex:1}.d{width:12px;height:12px;border-radius:50%}</style>
</head><body><div class="g"><div class="t" style="background:var(--info-container);color:var(--info-on-container)"><span class="d" style="background:var(--info-strong)"></span><b>Info</b><span class="v" style="color:inherit">#1F5FBF / #E7EEFA / #173F80</span></div><div class="t" style="background:var(--help-container);color:var(--help-on-container)"><span class="d" style="background:var(--help-strong)"></span><b>Help</b><span class="v" style="color:inherit">#0F7472 / #DFF1F0 / #0B4D4C</span></div><div class="t" style="background:var(--tip-container);color:var(--tip-on-container)"><span class="d" style="background:var(--tip-strong)"></span><b>Tip</b><span class="v" style="color:inherit">#6A3FC9 / #EEE8FB / #44278A</span></div><div class="t" style="background:var(--success-container);color:var(--success-on-container)"><span class="d" style="background:var(--success-strong)"></span><b>Success</b><span class="v" style="color:inherit">#1B7440 / #E3F2E9 / #145230</span></div><div class="t" style="background:var(--warning-container);color:var(--warning-on-container)"><span class="d" style="background:var(--warning-strong)"></span><b>Warning</b><span class="v" style="color:inherit">#9A5100 / #FBEEDB / #6B3900</span></div><div class="t" style="background:var(--danger-container);color:var(--danger-on-container)"><span class="d" style="background:var(--danger-strong)"></span><b>Danger</b><span class="v" style="color:inherit">#C0302A / #FBE6E4 / #7C1D18</span></div><div class="t" style="background:var(--neutral-container);color:var(--neutral-on-container)"><span class="d" style="background:var(--neutral-strong)"></span><b>Neutral</b><span class="v" style="color:inherit">#4A4E52 / #E8E9E5 / #17191B</span></div></div></body></html>
