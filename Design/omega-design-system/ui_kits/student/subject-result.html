<!-- @dsCard group="Student app" viewport="400x820" name="Subject result" subtitle="How one subject's mark was reached" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../kit.css"><link rel="stylesheet" href="student.css"></head>
<body>
<div class="kit-phone">
<div class="kit-status"><span>9:41</span></div>
<div class="kit-body">
<div class="om-screen om-detail-page">
<header class="om-screen-bar">
<div class="om-screen-bar-row"><button class="om-back-button" aria-label="Back"><i class="om-icon om-icon-chevron-left"></i></button>
<div class="om-screen-bar-title-slot">
<div class="om-screen-bar-title om-screen-bar-title--copy">Mathematics</div></div>
<div class="om-screen-bar-actions"></div></div></header>
<div class="om-screen-body">
<div class="om-screen-content">
<div class="om-screen-header"><h1 class="om-screen-header-title">Mathematics</h1></div>
<div class="sk-gap-16"></div>
<div class="om-board-card om-board-card--glow">
<div class="om-score"><span class="om-score__figure">88%</span>
<div class="om-progress om-progress--on-board" role="progressbar" aria-valuenow="88" aria-valuemin="0" aria-valuemax="100" style="--progress:88%">
<div class="om-progress__fill"></div></div><span class="om-score__caption">3 of 3 parts marked</span></div></div>
<div class="sk-gap-section"></div>
<div class="om-section-header"><h2 class="om-section-header__title">How this mark was reached</h2></div>
<div class="sk-gap-header"></div>
<div class="om-list-group">
<div class="om-list-row om-list-row--two-line">
<div class="om-list-row__main">
<div class="om-list-row__text">
<div class="om-list-row__title-row"><span class="om-list-row__title">Assignments</span><span class="om-list-row__value">90%</span></div><span class="om-list-row__supporting om-num">36 / 40</span><span class="om-caption sk-ink-3">20% of the final mark</span></div></div></div>
<div class="om-list-row om-list-row--two-line">
<div class="om-list-row__main">
<div class="om-list-row__text">
<div class="om-list-row__title-row"><span class="om-list-row__title">Tests</span><span class="om-list-row__value">84%</span></div><span class="om-list-row__supporting om-num">42 / 50</span><span class="om-caption sk-ink-3">30% of the final mark</span></div></div></div>
<div class="om-list-row om-list-row--two-line om-list-row--last">
<div class="om-list-row__main">
<div class="om-list-row__text">
<div class="om-list-row__title-row"><span class="om-list-row__title">Exams</span><span class="om-list-row__value">90%</span></div><span class="om-list-row__supporting om-num">72 / 80</span><span class="om-caption sk-ink-3">50% of the final mark</span></div></div></div></div>
<div class="sk-gap-16"></div><p class="sk-p om-caption sk-ink-3">Each part counts for a different share, so the final mark isn't the average of the three.</p></div></div></div></div></div>
</body></html>
