<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../kit.css"><link rel="stylesheet" href="parent.css">

<div class="kit-phone"><div class="kit-status"><span>9:41</span></div><div class="kit-body">
<div class="om-adaptive-shell pk-app"><div class="om-adaptive-shell-main"><div class="om-screen"><header class="om-screen-bar"><div class="om-screen-bar-row"><button class="om-back-button" aria-label="Back"><i class="om-icon om-icon-chevron-left"></i></button><div class="om-screen-bar-title-slot"><div class="om-screen-bar-title om-screen-bar-title--copy">Mathematics</div></div></div></header>
<div class="om-screen-body"><div class="om-screen-content">
<div class="om-screen-header"><h1 class="om-screen-header-title">Mathematics</h1></div>
<div class="pk-sp-12"></div>
<div class="om-board-card"><div class="om-score"><span class="om-score__figure">88%</span><div class="om-progress om-progress--on-board" style="--progress:88%"><div class="om-progress__fill"></div></div><span class="om-score__caption">3 of 3 parts marked</span></div></div>

<div class="om-list-group">
<div class="om-list-row">
  <div class="pk-entry-col pk-entry-col--tight"><span class="pk-inline pk-inline--between"><span class="om-body-strong pk-ink">Assignments</span><span class="om-body-strong pk-ink om-num">90%</span></span><span class="om-subhead pk-ink-2 om-num">18 / 20</span><span class="om-caption pk-ink-3 om-num">20% of the final mark</span></div>
</div>
<div class="om-list-row">
  <div class="pk-entry-col pk-entry-col--tight"><span class="pk-inline pk-inline--between"><span class="om-body-strong pk-ink">Tests</span><span class="om-body-strong pk-ink om-num">84%</span></span><span class="om-subhead pk-ink-2 om-num">42 / 50</span><span class="om-caption pk-ink-3 om-num">30% of the final mark</span></div>
</div>
<div class="om-list-row om-list-row--last">
  <div class="pk-entry-col pk-entry-col--tight"><span class="pk-inline pk-inline--between"><span class="om-body-strong pk-ink">Exams</span><span class="om-body-strong pk-ink om-num">89%</span></span><span class="om-subhead pk-ink-2 om-num">71.5 / 80</span><span class="om-caption pk-ink-3 om-num">50% of the final mark</span></div>
</div>
</div>
<div class="pk-sp-16"></div>

</div></div></div></div></div>
</div></div>
