<!-- @dsCard group="Teacher app" viewport="400x820" name="Register, cards" subtitle="Card deck part-way through the roll: 14 of 38 marked, roll 15 up" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../kit.css"><link rel="stylesheet" href="teacher.css"></head>
<body><div class="kit-phone"><div class="kit-status"><span>9:41</span></div><div class="kit-body">
<div class="tk-register"><div class="tk-register-band tk-board-top">
<div class="tk-register-band__row"><button class="tk-register-close" aria-label="Close the register"><span class="tk-register-close__disc"><i class="om-icon om-icon-close"></i></span></button>
<div class="tk-register-band__titles"><h1 class="tk-register-band__title">8B · Attendance</h1><span class="tk-register-band__count">14 of 38 marked</span></div>
<div class="tk-view-toggle" role="radiogroup"><span class="tk-view-toggle__option is-selected" role="radio">Cards</span><span class="tk-view-toggle__option" role="radio">List</span></div></div>
<div class="tk-register-rail" style="--progress:36.8%"><div class="tk-register-rail__fill"></div></div>
</div><div class="tk-register-body"><div class="tk-gap-16"></div><div class="tk-deck" style="--tk-deck-height:406px">
<div class="tk-deck__peek">Manya Saxena</div>
<div class="tk-student-card"><div class="tk-student-card__top"><span class="tk-student-card__roll">Roll 15</span>
<div class="tk-student-card__status"><span class="om-status-badge om-status-badge--neutral">Not marked</span></div></div>
<div class="tk-student-card__centre"><span class="tk-student-card__avatar">LB</span><p class="tk-student-card__name">Lakshya Bisht</p><p class="tk-student-card__position">15 of 38</p></div>
</div></div><div class="tk-gap-16"></div><div class="tk-roll-strip" style="margin-left:-98px"><div class="tk-roll-tile tk-roll-tile--success"><span class="tk-roll-tile__box">11</span><span class="tk-roll-tile__caption">P</span></div><div class="tk-roll-tile tk-roll-tile--success"><span class="tk-roll-tile__box">12</span><span class="tk-roll-tile__caption">P</span></div><div class="tk-roll-tile tk-roll-tile--success"><span class="tk-roll-tile__box">13</span><span class="tk-roll-tile__caption">P</span></div><div class="tk-roll-tile tk-roll-tile--success"><span class="tk-roll-tile__box">14</span><span class="tk-roll-tile__caption">P</span></div><div class="tk-roll-tile is-current"><span class="tk-roll-tile__box">15</span><span class="tk-roll-tile__caption">Now</span></div><div class="tk-roll-tile tk-roll-tile--unmarked"><span class="tk-roll-tile__box">16</span><span class="tk-roll-tile__caption"></span></div><div class="tk-roll-tile tk-roll-tile--unmarked"><span class="tk-roll-tile__box">17</span><span class="tk-roll-tile__caption"></span></div><div class="tk-roll-tile tk-roll-tile--unmarked"><span class="tk-roll-tile__box">18</span><span class="tk-roll-tile__caption"></span></div><div class="tk-roll-tile tk-roll-tile--unmarked"><span class="tk-roll-tile__box">19</span><span class="tk-roll-tile__caption"></span></div><div class="tk-roll-tile tk-roll-tile--unmarked"><span class="tk-roll-tile__box">20</span><span class="tk-roll-tile__caption"></span></div></div><div class="tk-gap-12"></div><div class="tk-register-controls">
<div class="tk-row"><button class="tk-outline-button tk-outline-button--square" aria-label="Undo"><i class="om-icon om-icon-undo"></i></button>
<button class="tk-outline-button tk-grow"><i class="om-icon om-icon-check"></i>Mark everyone else present</button></div>
<div class="tk-gap-16"></div>
<div class="tk-pair"><button class="tk-outline-button tk-outline-button--step"><i class="om-icon om-icon-chevron-left"></i>Previous child</button><button class="tk-outline-button tk-outline-button--step">Next child<i class="om-icon om-icon-chevron-right"></i></button></div>
<div class="tk-gap-12"></div>
<div class="tk-mark-grid"><button class="tk-outline-button tk-outline-button--mark">Present</button><button class="tk-outline-button tk-outline-button--mark">Absent</button>
<button class="tk-outline-button tk-outline-button--mark">Late</button><button class="tk-outline-button tk-outline-button--mark">Half day</button></div>
<div class="tk-gap-24"></div>
<div class="om-section-header"><h2 class="om-section-header__title">Ways to record a child</h2></div><div class="tk-gap-8"></div>
<div class="tk-stack tk-stack--4"><p class="om-subhead tk-ink-2">Swipe the card right to mark Present.</p><p class="om-subhead tk-ink-2">Swipe the card left to mark Absent.</p><p class="om-subhead tk-ink-2">Swipe the card up to choose Late or Half day.</p></div>
</div></div></div>
</div></div></body></html>
