<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}.wrap{display:flex;width:1280px;height:854px;background:var(--paper)}.main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 96px;gap:28px}.mark{font:600 200px/1 var(--font-sans);letter-spacing:-8px;color:var(--ink)}.sub{font:500 34px/1.3 var(--font-sans);color:var(--ink-2)}.bar{height:14px;width:520px;border-radius:9999px;background:var(--sunken);overflow:hidden}.bar i{display:block;width:62%;height:100%;border-radius:9999px;background:var(--accent)}.strip{width:320px;display:flex;flex-direction:column}.strip div{flex:1}</style>
</head><body><div class="wrap"><div class="main"><span class="mark">Omega</span><span class="sub">Quiet paper, ink, one ballpoint accent, one dark board.</span><div class="bar"><i></i></div></div>
<div class="strip"><div style="background:var(--accent)"></div><div style="background:var(--surface)"></div><div style="background:var(--ai-gradient)"></div><div style="background:var(--board)"></div></div></div></body></html>
